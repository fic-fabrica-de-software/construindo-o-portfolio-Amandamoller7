<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Amanda Garcia Moller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style/style.css">
</head>

<body>

<!-- Barra de pesquisa -->
<header class="meio">
  <div class="barra-pesquisa">
    <img class="lupa" src="assets/icons/pesquisa-de-lupa.png" alt="Pesquisar">
    <input id="textobarra" type="text" value="Amanda Garcia Moller" readonly>
    <img class="x" src="assets/icons/x.png" alt="Limpar">
  </div>
</header>

<!-- HERO -->
<main>

<section id="hero">
  <div class="brain-area">
    <img src="assets/fundo.png" class="fundo" alt="Cérebro">

    <span class="brain-point skills">Skills</span>
    <a href="projetos.html" class="brain-point projetos">Projetos</a>
  </div>

  <div class="sobre">
    <h2>Quem sou eu?</h2>

    <img src="assets/foto.jpg" class="foto" alt="Amanda Garcia Moller">

    <p>
      Sou uma pessoa muito criativa, com futura estudante de psicologia,
      sempre buscando aprender mais sobre as pessoas. Valorizo a autenticidade,
      a empatia e a dedicação em tudo o que faço.
    </p>
  </div>
</section>

<!-- PROJETOS -->
<section id="projetos">
  <h2>Projetos</h2>

  <div class="cards">
    <div class="card azul">Tremalize</div>
    <div class="card verde">Abraço</div>
  </div>
</section>

<!-- SKILLS -->
<section id="skills">
  <h2>Skills</h2>

  <div class="skills-box">
    <div class="barra" style="height:80%"></div>
    <div class="barra" style="height:40%"></div>
    <div class="barra" style="height:70%"></div>
    <div class="barra" style="height:90%"></div>
  </div>
</section>

</main>

<script src="js/main.js"></script>
</body>
</html>
